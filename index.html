<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080b18" />
  <title>Starfall Barrage</title>
</head>
<body>
  <main id="app">
    <header class="masthead">
      <div><span id="eyebrow" class="eyebrow"></span><h1 id="game-title"></h1><p id="game-subtitle"></p></div>
      <button id="pause-button" type="button">P · 일시정지</button>
    </header>
    <section class="cabinet" aria-label="탄막 슈팅 게임">
      <div class="playfield">
        <div id="game"></div>
        <div class="stage-label"><span id="stage-progress">STAGE 1 / 2</span><strong id="stage-name">달빛 초원</strong></div>
        <div id="boss-hud" class="boss-hud hidden"><div><strong id="boss-name"></strong><span id="boss-time">0.0</span></div><small id="boss-phase"></small><div class="boss-meter"><i id="boss-hp"></i></div></div>
        <div id="stage-message" class="stage-message hidden"><strong id="message-title"></strong><span id="message-text"></span></div>
        <div id="pause-layer" class="pause-layer hidden"><strong id="pause-title"></strong><span id="pause-help"></span></div>
        <div id="dialogue" class="dialogue hidden" data-side="left" role="dialog" aria-live="polite">
          <img id="dialogue-portrait" class="hidden" alt="" />
          <div class="dialogue-box"><span id="dialogue-speaker"></span><p id="dialogue-text"></p><button id="dialogue-next" type="button">다음 ›</button></div>
        </div>
        <div id="mobile-controls" class="mobile-controls">
          <div class="dpad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
          <div class="mobile-actions"><button id="mobile-focus" data-key="focus"></button><button id="mobile-shot" data-key="shoot"></button><button id="mobile-bomb" class="bomb" data-key="bomb"></button></div>
        </div>
        <div id="loading" class="loading"><strong id="loading-title"></strong><span>game-data/shooter.json</span></div>
      </div>
      <aside class="side-panel">
        <section class="logo-card"><span id="brand-kicker"></span><strong id="brand-title"></strong><p id="brand-caption">STARFALL BARRAGE</p></section>
        <section class="score-card"><label data-label="highScore"></label><strong id="high-score">000000000</strong><label data-label="score"></label><strong id="score">000000000</strong></section>
        <section class="resource-card"><div><label data-label="player"></label><span id="lives"></span></div><div><label data-label="bomb"></label><span id="bombs"></span></div><div><label data-label="power"></label><b id="power"></b><div class="power-meter"><i id="power-bar"></i></div></div></section>
        <section class="metric-card"><div><label data-label="graze"></label><strong id="graze">0</strong></div><div><label data-label="chain"></label><strong id="combo">—</strong></div></section>
        <section class="guide-card"><h2 id="guide-title"></h2><dl id="guide-list"></dl><p id="guide-tip"></p></section>
      </aside>
    </section>
  </main>
  <section id="result-screen" class="result-screen hidden" role="dialog" aria-modal="true"><div><span id="result-kicker"></span><h2 id="result-title"></h2><dl><div><dt data-label="score"></dt><dd id="result-score"></dd></div><div><dt data-label="graze"></dt><dd id="result-graze"></dd></div><div><dt data-label="highScore"></dt><dd id="result-high"></dd></div></dl><button id="restart" type="button"></button></div></section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
